<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker App</title>
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Palindrome Checker</h1>
        <p>Enter a word or phrase to check if it's a palindrome.</p>
        <input id="inputBox" placeholder="Type here..." name="palindrome" />
        <button id="btn">Check Palindrome</button>
        <p id="check">The Value Is Not Palindrome</p>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
